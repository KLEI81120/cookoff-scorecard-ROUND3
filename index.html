<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cook-off judge scorecard - Round 3</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#16302b;--mut:#5d716c;--line:#d5ddd8;--acc:#e0930c;--accInk:#1d1400;--ok:#2b7a57;--okBg:#dff1e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c19;--card:#182a26;--ink:#eaf1ee;--mut:#9bb0aa;--line:#2b423d;--acc:#f0a824;--ok:#5cc596;--okBg:#1d4034}}
:root[data-theme="dark"]{--bg:#0f1c19;--card:#182a26;--ink:#eaf1ee;--mut:#9bb0aa;--line:#2b423d;--acc:#f0a824;--ok:#5cc596;--okBg:#1d4034}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.prog{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.prog b{font-size:1.5rem}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.dish{min-height:92px;text-align:left;padding:12px;border-radius:12px;border:2px dashed var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:space-between}
.dish .n{font-weight:800;font-size:1.25rem}
.dish .nm{font-size:.85rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish .st{font-size:.85rem;font-weight:600;color:var(--mut)}
.dish.done{border:2px solid var(--ok);background:var(--okBg)}
.dish.done .st{color:var(--ok)}
.dish.add{align-items:center;justify-content:center;font-weight:600;color:var(--mut)}
.btn{border:0;background:var(--acc);color:var(--accInk);font-weight:700;border-radius:10px;padding:12px 18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crit{margin:18px 0}
.crit>div{font-weight:600;margin-bottom:6px}
.scale{display:flex;gap:6px}
.scale button{flex:1;max-width:64px;font-size:2.1rem;line-height:1;padding:6px 0;border:0;background:none;color:var(--mut);border-radius:8px}
.scale button.on{color:var(--acc)}
.yn{display:flex;gap:8px}
.yn button{flex:1;padding:12px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:600}
.yn button.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.total{font-size:1.4rem;font-weight:800}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Cook-off scorecard - Round 3</h1>
  <p class="sub">Tap any dish to rate it, in any order. You can change a score later.</p>
  <label for="judge">Judge name</label>
  <input id="judge" placeholder="Your name" autocomplete="name">
  <div class="prog"><div class="row"><span><b id="cnt">0</b> of <span id="tot">0</span> dishes rated</span><span id="left" class="sub" style="margin:0"></span></div><div class="bar"><i id="fill" style="width:0"></i></div><p id="sync" class="sub" style="margin:10px 0 0;font-size:.9rem"></p></div>
  <div class="grid" id="grid"></div>
  <div id="results"></div>
  <p style="margin-top:32px"><button class="ghost" id="reset">Clear all my scores</button></p>
</section>

<section id="rate" class="hide">
  <button class="ghost" id="back">Back to all dishes</button>
  <h1 id="rtitle" style="margin-top:16px"></h1>
  <div id="crits"></div>
  <label for="note">Notes</label>
  <textarea id="note" rows="3" placeholder="Anything you want to remember"></textarea>
  <div class="row" style="margin-top:18px"><span class="total" id="rtotal"></span><button class="btn" id="save">Save score</button></div>
</section>
</main>
<script>
// Edit this list to change what judges score, and the top of the scale.
var CRITERIA=['Texture','Taste','Overall Presentation','Bonus Point'];
// Categories listed here are scored 0 or 1 (No / Yes) instead of 1 to 5 stars.
var YESNO={'Bonus Point':true};
// Optional one-line guidance shown under a category. Add one entry per category name.
var CRIT_HELP={
  'Texture':'Is the noodle component doing what it was born to do?',
  'Taste':'Does it actually taste amazing? This may be the most important question of all.',
  'Overall Presentation':'Does it look as good as it tastes?',
  'Bonus Point':'One point will be awarded for contestants who incorporate Mid-Autumn elements (lanterns, jade rabbits, and moon motifs) in their dish.'
};
var MAX=5, KEY='cookoff-v8';
// Google Apps Script web app URL to send scores to your Google Sheet.
var SUBMIT_URL='https://script.google.com/macros/s/AKfycbzukXZL0Mc6I15FEn9aoZkhJHDsMVDDH4vl21RwGP9NCiSTQc0BRt6SoZ1FzAoK4gXi/exec';

// Custom dish numbers: 1, 5, 7, 9, 10
var DISH_IDS=[1, 5, 7, 9, 10];
// Optional names mapping by dish ID, e.g. {1: 'Spicy Noodle', 5: 'Sesame Noodle'}
var DISH_NAME_MAP={};

var S=load(), cur=null, draft=null, armed={}, sending=false;
S.pending=S.pending||{};
if(!S.jid)S.jid=Math.random().toString(36).slice(2,10);
S.dishes=DISH_IDS.map(function(num){
  return {id: num, name: DISH_NAME_MAP[num] || ''};
});

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  var d=DISH_IDS.map(function(num){
    return {id: num, name: DISH_NAME_MAP[num] || ''};
  });
  return{judge:'',dishes:d,ratings:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function total(r){return CRITERIA.reduce(function(a,c){return a+(r.scores[c]||0)},0)}
function maxOf(c){return YESNO[c]?1:MAX}
function maxTotal(){return CRITERIA.reduce(function(a,c){return a+maxOf(c)},0)}
function label(d){return 'Dish '+d.id+(d.name?' · '+d.name:'')}

function renderHome(){
  var done=S.dishes.filter(function(d){return S.ratings[d.id]}).length;
  $('cnt').textContent=done;$('tot').textContent=S.dishes.length;
  var left=S.dishes.length-done;
  $('left').textContent=left?left+' still to taste':'All rated';
  $('fill').style.width=(S.dishes.length?done/S.dishes.length*100:0)+'%';
  $('judge').value=S.judge||'';
  var h='';
  S.dishes.forEach(function(d){
    var r=S.ratings[d.id];
    h+='<button class="dish'+(r?' done':'')+'" data-id="'+d.id+'"><span><span class="n">Dish '+d.id+'</span><br><span class="nm">'+esc(d.name||'')+'</span></span><span class="st">'+(r?'Rated · '+total(r)+'/'+maxTotal():'Not rated yet')+'</span></button>';
  });
  $('grid').innerHTML=h;
  var rated=S.dishes.filter(function(d){return S.ratings[d.id]}).sort(function(a,b){return total(S.ratings[b.id])-total(S.ratings[a.id])});
  if(!rated.length){$('results').innerHTML='';updateSync();return}
  var t='<h2>My scores so far</h2><div class="scroll"><table><tr><th>Dish</th>'+CRITERIA.map(function(c){return'<th>'+esc(c)+'</th>'}).join('')+'<th>Total</th></tr>';
  rated.forEach(function(d){var r=S.ratings[d.id];t+='<tr><td>'+esc(label(d))+'</td>'+CRITERIA.map(function(c){return'<td>'+r.scores[c]+'</td>'}).join('')+'<td><b>'+total(r)+'</b></td></tr>'});
  $('results').innerHTML=t+'</table></div>';updateSync();
}

function openDish(id){
  cur=S.dishes.filter(function(d){return d.id==id})[0];
  var r=S.ratings[id];
  draft={scores:r?Object.assign({},r.scores):{},note:r?r.note:''};
  $('rtitle').textContent=label(cur);
  $('note').value=draft.note;
  $('home').classList.add('hide');$('rate').classList.remove('hide');
  renderCrits();window.scrollTo(0,0);
}
function renderCrits(){
  var h='';
  CRITERIA.forEach(function(c,ci){
    var v=draft.scores[c],has=v!==undefined;
    h+='<div class="crit"><div>'+esc(c)+' <span class="sub" style="margin:0 0 0 8px">'+(has?v+' / '+maxOf(c):'not scored')+'</span></div>'+(CRIT_HELP[c]?'<div class="sub" style="margin:0 0 8px;font-weight:400">'+esc(CRIT_HELP[c])+'</div>':'');
    if(YESNO[c]){
      h+='<div class="yn"><button data-c="'+ci+'" data-v="0" class="'+(v===0?'on':'')+'">No bonus</button><button data-c="'+ci+'" data-v="1" class="'+(v===1?'on':'')+'">Yes, +1 point</button></div>';
    }else{
      h+='<div class="scale">';
      for(var n=1;n<=MAX;n++)h+='<button data-c="'+ci+'" data-v="'+n+'" class="'+((v||0)>=n?'on':'')+'" aria-label="'+esc(c)+': '+n+' of '+MAX+' stars">'+((v||0)>=n?'\u2605':'\u2606')+'</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  $('crits').innerHTML=h;
  var scored=CRITERIA.every(function(c){return draft.scores[c]!==undefined});
  var named=(S.judge||'').trim().length>0;
  $('save').disabled=!(scored&&named);
  $('rtotal').textContent=!named?'Enter your name on the main page first':scored?'Total '+total(draft)+' / '+maxTotal():'Score every category to save';
}
function goHome(){cur=null;$('rate').classList.add('hide');$('home').classList.remove('hide');renderHome()}

$('grid').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  openDish(b.dataset.id);
});
$('crits').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  draft.scores[CRITERIA[b.dataset.c]]=+b.dataset.v;renderCrits();
});
$('judge').addEventListener('input',function(){S.judge=this.value;save()});
$('judge').addEventListener('change',function(){
  if(!S.judge.trim())return;
  Object.keys(S.ratings).forEach(queue);save();flush();
});
$('back').onclick=goHome;
$('save').onclick=function(){
  S.ratings[cur.id]={scores:draft.scores,note:$('note').value};
  queue(cur.id);
  save();goHome();flush();
};
$('reset').onclick=function(){
  if(!armed.reset){armed.reset=1;this.textContent='Tap again to clear every score';return}
  armed.reset=0;this.textContent='Clear all my scores';S.ratings={};save();renderHome();
};
// ---- Sending scores to the organizer's Google Sheet ----
function queue(id){
  var d=S.dishes.filter(function(x){return x.id==id})[0],r=S.ratings[id];
  if(!d||!r||!S.judge.trim())return;
  S.pending[id]={jid:S.jid,judge:S.judge.trim(),dish:d.id,dishName:d.name,criteria:CRITERIA,scores:r.scores,total:total(r),note:r.note,at:new Date().toISOString()};
}
function updateSync(){
  var el=$('sync');if(!el)return;
  if(!SUBMIT_URL){el.textContent='';return}
  var n=Object.keys(S.pending).length;
  el.textContent=n?n+' score'+(n>1?'s':'')+' waiting to send. Keep this page open with a connection.':'All your scores have been sent.';
}
function flush(){
  var ids=Object.keys(S.pending);
  if(!SUBMIT_URL||!ids.length||sending){updateSync();return}
  sending=true;
  var id=ids[0],p=S.pending[id];
  fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
    .then(function(){if(S.pending[id]===p)delete S.pending[id];save();sending=false;flush()})
    .catch(function(){sending=false;updateSync()});
  updateSync();
}
window.addEventListener('online',flush);
setInterval(flush,15000);
Object.keys(S.ratings).forEach(function(id){if(!S.pending[id]&&!S.sentOnce)queue(id)});
S.sentOnce=true;save();
renderHome();flush();
</script>
</body>
</html>
