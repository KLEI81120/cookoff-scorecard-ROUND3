<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cook-off judge ranking - Round 3</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#16302b;--mut:#5d716c;--line:#d5ddd8;--acc:#e0930c;--accInk:#1d1400;--ok:#2b7a57;--okBg:#dff1e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c19;--card:#182a26;--ink:#eaf1ee;--mut:#9bb0aa;--line:#2b423d;--acc:#f0a824;--ok:#5cc596;--okBg:#1d4034}}
:root[data-theme="dark"]{--bg:#0f1c19;--card:#182a26;--ink:#eaf1ee;--mut:#9bb0aa;--line:#2b423d;--acc:#f0a824;--ok:#5cc596;--okBg:#1d4034}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;line-height:1.45}
main{max-width:600px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.85rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer}
.form-row{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media (max-width:480px){.form-row{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:12px;margin:16px 0 24px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s,background .2s}
.item.ranked{border-color:var(--ok);background:var(--okBg)}
.dish-info .dish-title{font-weight:800;font-size:1.25rem}
.dish-info .dish-name{font-size:.9rem;color:var(--mut)}
.rank-badge{min-width:110px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.item.ranked .rank-badge{background:var(--acc);border-color:var(--acc);color:var(--accInk);font-size:1.15rem;font-weight:800}
.btn{width:100%;border:0;background:var(--acc);color:var(--accInk);font-weight:800;border-radius:12px;padding:15px;font-size:1.1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:14px;text-align:center;font-size:.92rem;color:var(--mut)}
.hide{display:none}

/* Locked Confirmation View */
.thanks-card{background:var(--card);border:2px solid var(--ok);border-radius:20px;padding:36px 20px;text-align:center;margin-top:20px}
.icon{font-size:3.5rem;line-height:1;margin-bottom:12px}
.summary-box{background:var(--bg);border-radius:12px;padding:14px;margin:20px 0;text-align:left}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.summary-row:last-child{border-bottom:0}
</style>
</head>
<body>
<main>
  <!-- Voting Section -->
  <section id="vote-view">
    <h1>Round 3: Final ranking</h1>
    <p class="sub">Tap each dish button in your preferred order. First tap is <b>Rank #1 (Best)</b>, next is #2, etc. Tap any ranked dish again to remove or adjust it.</p>

    <div class="form-row">
      <div>
        <label for="judge">Your name</label>
        <input id="judge" placeholder="Your name" autocomplete="name">
      </div>
      <div>
        <label for="token">4-digit token</label>
        <input id="token" type="tel" maxlength="4" placeholder="e.g. 1029" autocomplete="off">
      </div>
    </div>

    <div class="list" id="list"></div>

    <button class="btn" id="submit" disabled>Submit final rankings</button>
    <p id="status" class="status"></p>
  </section>

  <!-- Locked Thanks Screen -->
  <section id="thanks-view" class="hide">
    <div class="thanks-card">
      <div class="icon">&#10004;&#65039;</div>
      <h1 style="font-size:2.2rem;margin-bottom:4px">Thanks!</h1>
      <p class="sub" style="font-size:1.05rem">Your vote has been submitted and verified.</p>
      <p style="font-weight:700" id="thanks-judge"></p>
      <div class="summary-box" id="thanks-summary"></div>
      <p class="sub" style="font-size:.85rem;margin-top:24px">Only 1 ballot per token. Enjoy the rest of the cook-off!</p>
    </div>
  </section>
</main>

<script>
var KEY = 'cookoff-r3-token-v1';
var SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbzukXZL0Mc6I15FEn9aoZkhJHDsMVDDH4vl21RwGP9NCiSTQc0BRt6SoZ1FzAoK4gXi/exec';

var DISH_IDS = [1, 2, 3, 4, 5];
var DISH_NAMES = {};

var S = load(), sending = false;
if (!S.jid) S.jid = Math.random().toString(36).slice(2, 10);

var $ = function(i) { return document.getElementById(i); };

function checkClientLock() {
  return localStorage.getItem('r3_token_locked') === 'true' ||
         sessionStorage.getItem('r3_token_locked') === 'true' ||
         document.cookie.indexOf('r3_token_locked=true') !== -1;
}

function engageClientLock() {
  localStorage.setItem('r3_token_locked', 'true');
  sessionStorage.setItem('r3_token_locked', 'true');
  document.cookie = "r3_token_locked=true; max-age=604800; path=/; SameSite=Lax";
}

function load() {
  try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e) {}
  return { judge: '', token: '', ranks: {}, submitted: false };
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

function getNextAvailableRank() {
  var assigned = Object.values(S.ranks);
  for (var r = 1; r <= DISH_IDS.length; r++) {
    if (assigned.indexOf(r) === -1) return r;
  }
  return null;
}

function render() {
  if (checkClientLock() || S.submitted) {
    showThanksScreen();
    return;
  }

  $('vote-view').classList.remove('hide');
  $('thanks-view').classList.add('hide');

  $('judge').value = S.judge || '';
  $('token').value = S.token || '';

  var h = '';
  DISH_IDS.forEach(function(id) {
    var r = S.ranks[id];
    var isRanked = r !== undefined;
    h += '<div class="item' + (isRanked ? ' ranked' : '') + '">';
    h += '  <div class="dish-info">';
    h += '    <div class="dish-title">Dish ' + id + '</div>';
    if (DISH_NAMES[id]) h += '    <div class="dish-name">' + DISH_NAMES[id] + '</div>';
    h += '  </div>';
    h += '  <button class="rank-badge" data-id="' + id + '">';
    h += isRanked ? 'Rank #' + r : 'Tap to rank';
    h += '  </button>';
    h += '</div>';
  });
  $('list').innerHTML = h;

  var totalRanked = Object.keys(S.ranks).length;
  var hasName = (S.judge || '').trim().length > 0;
  var hasToken = (S.token || '').trim().length === 4;
  var allRanked = totalRanked === DISH_IDS.length;

  $('submit').disabled = !(allRanked && hasName && hasToken && !sending);

  if (!hasName) {
    $('status').textContent = 'Enter your name above.';
  } else if (!hasToken) {
    $('status').textContent = 'Enter your 4-digit voting token.';
  } else if (!allRanked) {
    var next = getNextAvailableRank();
    $('status').textContent = 'Next tap will assign: Rank #' + next + ' (' + (DISH_IDS.length - totalRanked) + ' left)';
  } else {
    $('status').textContent = 'All dishes ranked! Ready to submit.';
  }
}

function showThanksScreen() {
  $('vote-view').classList.add('hide');
  $('thanks-view').classList.remove('hide');
  $('thanks-judge').textContent = S.judge ? ('Judge: ' + S.judge + (S.token ? ' (Token: ' + S.token + ')' : '')) : '';

  history.pushState(null, '', location.href);
  window.onpopstate = function() {
    history.pushState(null, '', location.href);
  };

  var sorted = DISH_IDS.slice().sort(function(a, b) {
    return (S.ranks[a] || 99) - (S.ranks[b] || 99);
  });

  var summaryHtml = '';
  sorted.forEach(function(id) {
    var r = S.ranks[id];
    if (r) {
      summaryHtml += '<div class="summary-row">';
      summaryHtml += '  <span><b>#' + r + '</b> &mdash; Dish ' + id + (DISH_NAMES[id] ? ' (' + DISH_NAMES[id] + ')' : '') + '</span>';
      summaryHtml += '</div>';
    }
  });
  $('thanks-summary').innerHTML = summaryHtml;
  window.scrollTo(0, 0);
}

$('list').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var id = +btn.dataset.id;

  if (S.ranks[id] !== undefined) {
    var removedRank = S.ranks[id];
    delete S.ranks[id];
    Object.keys(S.ranks).forEach(function(k) {
      if (S.ranks[k] > removedRank) S.ranks[k]--;
    });
  } else {
    var next = getNextAvailableRank();
    if (next) S.ranks[id] = next;
  }

  save();
  render();
});

$('judge').addEventListener('input', function() {
  S.judge = this.value;
  save();
  render();
});

$('token').addEventListener('input', function() {
  S.token = this.value.replace(/\D/g, '').slice(0, 4);
  this.value = S.token;
  save();
  render();
});

$('submit').addEventListener('click', function() {
  if (sending) return;
  sending = true;
  $('submit').disabled = true;
  $('status').textContent = 'Submitting ballot...';

  var rankedList = DISH_IDS.map(function(id) {
    return {
      dish: id,
      dishName: DISH_NAMES[id] || '',
      rank: S.ranks[id]
    };
  });

  var payload = {
    jid: S.jid,
    judge: S.judge.trim(),
    token: S.token.trim(),
    at: new Date().toISOString(),
    ranks: rankedList
  };

  fetch(SUBMIT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(function() {
    S.submitted = true;
    engageClientLock();
    save();
    sending = false;
    showThanksScreen();
  })
  .catch(function() {
    sending = false;
    $('status').textContent = 'Connection error. Please try tapping Submit again.';
    render();
  });
});

render();
</script>
</body>
</html>
